[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resilience-map"
version = "0.1.0"
description = "Human Resilience Map: extreme-heat vulnerability and cooling-center planning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "shapely>=2.0",
  "ortools>=9.10",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "boto3>=1.34",
  "jinja2>=3.1",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
  "dash>=2.18",
  "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[s3,sqs,bedrock-runtime]>=1.34",
]
geo = [
    "numpy>=2.4.6",
    "planetary-computer>=1.0.0",
    "pyproj>=3.7.2",
    "pystac-client>=0.9.0",
    "rasterio>=1.4.4",
]

[project.scripts]
hrm = "resilience_map.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resilience_map"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "S608",  # SQL strings are static; identifiers never come from user input
  "E501",  # line length is enforced by `ruff format`; long SQL/message strings are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a running PostGIS database (DATABASE_URL)"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# Strictest checking where correctness matters most: the deterministic analytical core.
[[tool.mypy.overrides]]
module = [
  "resilience_map.risk.*",
  "resilience_map.gis.*",
  "resilience_map.optimization.*",
  "resilience_map.verification.*",
  "resilience_map.core.*",
]
warn_return_any = true

# Dash's type stubs reject `aria-*`/`data-*` keyword attributes and typed children; those are valid
# HTML. Everything else is still checked in the UI package.
[[tool.mypy.overrides]]
module = "resilience_map.frontend.*"
disable_error_code = ["arg-type", "assignment", "call-overload"]
