name: hrm-poc
x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE required}
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  environment:
    HRM_DB_HOST: db
    HRM_DB_NAME: resilience
    HRM_DB_USER: resilience
    HRM_API_BASE_URL: http://api:8000
    HRM_IMPORT_PATH: /data/imports
  depends_on:
    db: {condition: service_healthy}
services:
  db:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE required}
    restart: unless-stopped
    environment: {POSTGRES_DB: resilience, POSTGRES_USER: resilience}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 768m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U resilience -d resilience"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    <<: *app
    restart: "no"
    command: [migrate]
    profiles: [tools]
  api:
    <<: *app
    command: [api]
    volumes: ["uploads:/data/imports"]
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  frontend:
    <<: *app
    command: [frontend]
    mem_limit: 768m
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8050/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  dispatcher:
    <<: *app
    command: [dispatcher]
    mem_limit: 256m
  worker:
    <<: *app
    command: [worker]
    mem_limit: 1g
    stop_grace_period: 120s
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN required}"}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    mem_limit: 128m
    logging: *logging
    depends_on:
      frontend: {condition: service_healthy}
volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
